name: "search_and_extract_decklist"
description: "Search web for decklist and extract card names"
version: "1.0"

inputs:
  commander_name:
    type: string
    required: true
    description: "Commander name to search for"
  
  max_cards:
    type: integer
    required: false
    default: 100
    description: "Maximum number of cards to extract"

steps:
  - name: search_decklist
    skill: data/fetch-web-page
    args:
      url: "https://edhrec.com/commanders/{{inputs.commander_name}}"
      output_format: "text"
    outputs:
      page_content: "{{result.content}}"

outputs:
  decklist_content: "{{steps.search_decklist.outputs.page_content}}"
