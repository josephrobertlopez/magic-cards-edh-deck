# Web Knowledge Query Workflow
#
# Search the web for information and return structured knowledge.
# Useful for: card combos, deck strategies, rulings, meta analysis

name: web-knowledge-query
description: |
  Query the web for Magic: The Gathering knowledge and return structured answers.
  Supports card questions, combo explanations, strategy guides, and meta analysis.

# Input variables
inputs:
  question:
    type: string
    required: true
    description: Question to answer (e.g., "What combos with Gitrog Monster?")
    example: "What are the best cards for Frog Tribal EDH?"

  search_type:
    type: string
    required: false
    default: "auto"
    description: Type of search (auto, card, combo, strategy, ruling, meta)
    example: "combo"

  max_sources:
    type: integer
    required: false
    default: 5
    description: Maximum number of sources to fetch

  include_domains:
    type: array
    required: false
    default: []
    description: Specific domains to include (empty = use defaults)
    example: ["edhrec.com", "scryfall.com"]

# Workflow steps
steps:
  # STEP 1: Prepare search query based on question
  - name: prepare-search
    skill: web/search-query
    description: "Convert question into optimized search query"
    input:
      query: ${input.question}
      max_results: ${input.max_sources}
      allowed_domains: ${input.include_domains}
    output_var: search_params
    on_error: halt

  # STEP 2: Execute web search
  # NOTE: This would be handled by MCP server's WebSearch tool
  # The search_params from step 1 provide the query and filters
  # Results would be stored in search_results variable
  #
  # For now, we define the expected output format:
  # search_results:
  #   - url: "https://edhrec.com/..."
  #     title: "Best Frog Tribal Cards"
  #     snippet: "..."
  #   - url: "https://scryfall.com/..."
  #     ...

  # STEP 3: Fetch content from top results
  # In a full implementation, this would iterate over search_results
  # and fetch each URL's content
  #
  # - name: fetch-top-result
  #   skill: web/fetch-page
  #   input:
  #     url: ${search_results[0].url}
  #     extract_type: "text"
  #   output_var: page_content

  # STEP 4: Synthesize knowledge
  # Would use LLM to synthesize answer from fetched content
  # This is where the MCP server's AI analysis would happen

# Output
output:
  search_query: ${search_params.data.query}
  search_domains: ${search_params.data.allowed_domains}
  question: ${input.question}
  # In full implementation:
  # answer: ${synthesized_answer}
  # sources: ${source_urls}
  # confidence: ${confidence_score}

# Metadata
metadata:
  version: "0.1"
  author: "A2A Orchestrator"
  tags:
    - web-search
    - knowledge
    - q-and-a
    - mtg-strategy
  use_cases:
    - "Explain card combos"
    - "Find deck strategies"
    - "Look up rulings"
    - "Get meta analysis"
    - "Discover card synergies"
  examples:
    - question: "What combos with Gitrog Monster?"
      expected_domains: ["edhrec.com", "commanderspellbook.com"]
    - question: "Best lands for Frog Tribal?"
      expected_domains: ["edhrec.com", "scryfall.com"]
    - question: "Is Dockside Extortionist banned?"
      expected_domains: ["mtgcommander.net", "edhrec.com"]
