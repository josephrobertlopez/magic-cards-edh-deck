# Fetch Decklist from URL and Generate Proxies
#
# This workflow fetches a decklist from a URL, parses it, and generates proxies

name: fetch-and-generate
description: |
  Fetch a decklist from a URL and generate printer-ready proxy cards.
  Supports: Moxfield, Archidekt, MTGGoldfish, MTGDecks, EDHREC

# Input variables
inputs:
  decklist_url:
    type: string
    required: true
    description: URL of the decklist page
    example: "https://mtgdecks.net/Commander/magda-brazen-outlaw-decklist-by-matthew-thornton-2693335"

  card_size:
    type: string
    required: false
    default: "mtg"
    description: Card size (mtg, pokemon, yugioh, mini, tarot, business)

  no_pdf:
    type: boolean
    required: false
    default: false
    description: Skip PDF conversion (PPTX only)

# Workflow steps
steps:
  # STEP 1: Fetch decklist from URL
  - name: fetch-decklist-url
    skill: web/fetch-page
    description: "Fetch decklist content from URL"
    input:
      decklist_url: ${input.decklist_url}
      output_format: "txt"
    output_var: fetch_params
    on_error: halt

  # NOTE: At this point, the MCP server would execute the actual WebFetch
  # and return the page content. For now, this workflow defines the protocol.
  #
  # In full implementation, there would be a parsing step here:
  # - name: parse-decklist
  #   skill: data/parse-decklist
  #   input:
  #     content: ${fetch_params.content}
  #     platform: ${fetch_params.platform}
  #   output_var: parsed_decklist

  # STEP 2: Select template based on card size
  - name: select-template
    skill: template/select-by-card-size
    description: "Select appropriate template"
    input:
      card_size: ${input.card_size}
    output_var: template_info
    on_error: halt

  # Remaining steps would be:
  # 3. Save parsed decklist to file
  # 4. Fetch card images (using existing fetch-cards skill)
  # 5. Generate PPTX (using existing generate-presentation skill)
  # 6. Convert to PDF (using existing convert-to-pdf skill)

# Output
output:
  fetch_url: ${input.decklist_url}
  fetch_params: ${fetch_params.data}
  template_selected: ${template_info.data.template_path}
  # In full implementation:
  # decklist_path: ${saved_decklist_path}
  # pptx: ${pptx_path}
  # pdf: ${pdf_path}

# Metadata
metadata:
  version: "0.1-demo"
  author: "A2A Orchestrator"
  tags:
    - fetch-from-url
    - decklist-import
    - proxy-generation
  status: "demonstration"
  note: |
    This workflow demonstrates the pattern for fetching decklists from URLs.

    To make this production-ready, you would need to add:
    1. Decklist parsing skill (extract card names from HTML)
    2. File saving skill (save parsed list to decklists/)
    3. Integration with existing proxy pipeline

    The fetch-page skill prepares the fetch parameters, and the MCP server
    would execute the actual WebFetch using Claude Code's built-in capabilities.
