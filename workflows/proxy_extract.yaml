name: "proxy_extract"
description: "Extract stage - Fetch card data from Scryfall API"
version: "1.0"

inputs:
  decklist_path:
    type: string
    required: true
    description: "Path to decklist file"

  output_dir:
    type: string
    required: false
    default: ".claude/state"
    description: "Directory for manifest output"

steps:
  - name: fetch_cards
    skill: data/fetch-from-api
    args:
      decklist_path: "{{inputs.decklist_path}}"
      output_dir: ".claude/cards"
      manifest_path: "{{inputs.output_dir}}/manifest.json"
    outputs:
      manifest_path: "{{inputs.output_dir}}/manifest.json"

outputs:
  manifest_file: "{{steps.fetch_cards.outputs.manifest_path}}"
