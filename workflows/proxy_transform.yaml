name: "proxy_transform"
description: "Transform stage - Generate PPTX presentation from card images"
version: "1.0"

inputs:
  manifest_path:
    type: string
    required: true
    description: "Path to card manifest JSON"

  template_path:
    type: string
    required: false
    default: "template_2v6h_FIXED.pptx"
    description: "PowerPoint template file"

  output_path:
    type: string
    required: true
    description: "Output PPTX file path"

steps:
  - name: generate_pptx
    skill: presentation/place-images-in-pptx
    args:
      manifest_path: "{{inputs.manifest_path}}"
      template_path: "{{inputs.template_path}}"
      output_path: "{{inputs.output_path}}"
    outputs:
      pptx_file: "{{inputs.output_path}}"

outputs:
  presentation_file: "{{steps.generate_pptx.outputs.pptx_file}}"
