# Example: Web Search to Proxy Pipeline
#
# This workflow demonstrates using web skills to find a decklist online,
# then generating proxies from it.

name: web-search-example
description: |
  Search for a decklist online, fetch it, and generate printer-ready proxies.
  Demonstrates integration of web search skills with proxy generation pipeline.

# Input variables
inputs:
  commander:
    type: string
    required: true
    description: Commander name to search for
    example: "Gitrog Monster"

  card_size:
    type: string
    required: false
    default: "mtg"
    description: Card size (mtg, pokemon, yugioh, etc.)

  no_pdf:
    type: boolean
    required: false
    default: false
    description: Skip PDF conversion

# Workflow steps
steps:
  # STEP 1: Search for commander decklists
  - name: search-decklists
    skill: web/search-query
    description: "Search for commander decklists online"
    input:
      commander: ${input.commander}
    output_var: search_results
    on_error: halt

  # STEP 2: Select template based on card size
  - name: select-template
    skill: template/select-by-card-size
    description: "Select appropriate template"
    input:
      card_size: ${input.card_size}
    output_var: template_info
    on_error: halt

  # NOTE: In a real workflow, there would be intermediate steps to:
  # 1. Present search results to user
  # 2. Let user choose a specific decklist URL
  # 3. Fetch the decklist from that URL
  # 4. Parse it into card names
  # 5. Save as decklist file
  #
  # For now, this workflow demonstrates the pattern.
  # Those steps would use: web/fetch-page skill + parsing logic

  # STEP 3: Fetch cards (assuming we have decklist_path from previous steps)
  # - name: fetch-cards
  #   skill: fetch-cards
  #   input:
  #     decklist: ${decklist_path}
  #   output_var: manifest_path

  # STEP 4: Generate presentation
  # - name: generate-presentation
  #   skill: generate-presentation
  #   input:
  #     manifest: ${manifest_path}
  #     template: ${template_info.data.template_path}
  #   output_var: pptx_path

  # STEP 5: Convert to PDF
  # - name: convert-to-pdf
  #   skill: convert-to-pdf
  #   input:
  #     source: ${pptx_path}
  #   output_var: pdf_path
  #   condition: ${input.no_pdf} == false

# Output
output:
  search_query: ${search_results.data.query}
  search_domains: ${search_results.data.allowed_domains}
  template_selected: ${template_info.data.template_path}
  # pptx: ${pptx_path}
  # pdf: ${pdf_path}

# Metadata
metadata:
  version: "0.1-example"
  author: "A2A Orchestrator"
  tags:
    - web-search
    - example
    - decklist-discovery
  status: "demonstration"
  note: |
    This is a demonstration workflow showing how web search skills integrate
    with the proxy generation pipeline. To make this production-ready, you
    would need to add:
    - Interactive step to let user choose from search results
    - Decklist parsing from fetched URL
    - File saving logic
