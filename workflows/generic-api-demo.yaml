name: generic-api-demo
description: |
  Demonstrates generic API orchestration capability.

  This workflow can fetch from ANY API by providing a custom api_url_template.
  The template must include {identifier} placeholder for item names.

  Examples:
    - Scryfall MTG: "https://api.scryfall.com/cards/named?fuzzy={identifier}"
    - Pokémon API: "https://pokeapi.co/api/v2/pokemon/{identifier}"
    - Custom API: "https://api.example.com/items/{identifier}"

steps:
  - name: fetch-from-generic-api
    skill: data/fetch-from-api
    input:
      decklist_path: ${input.decklist_path}
      output_dir: images
      api_url: ${input.api_url}
    output_var: fetch_result

output:
  status: ${fetch_result.status}
  manifest_path: ${fetch_result.manifest_path}
  output_dir: ${fetch_result.output_dir}

# Example usage:
#
# 1. Fetch MTG cards (default):
#    python3 a2a_orchestrator/orchestrator.py workflows/generic-api-demo.yaml \
#      decklist_path=decklists/frog_tribal.txt
#
# 2. Fetch Pokémon data:
#    python3 a2a_orchestrator/orchestrator.py workflows/generic-api-demo.yaml \
#      decklist_path=pokemon_list.txt \
#      api_url_template="https://pokeapi.co/api/v2/pokemon/{identifier}"
#
# 3. Fetch from custom API:
#    python3 a2a_orchestrator/orchestrator.py workflows/generic-api-demo.yaml \
#      decklist_path=items.txt \
#      api_url_template="https://api.yourservice.com/v1/items/{identifier}"
