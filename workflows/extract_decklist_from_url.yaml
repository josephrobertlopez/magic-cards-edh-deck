name: "Extract Decklist from URL"
description: "Fetch HTML from URL and extract decklist using CSS selectors"
version: "1.0"

inputs:
  url:
    type: string
    required: true
    description: "URL of the decklist page"

  selector:
    type: string
    required: true
    description: "CSS selector for card items (e.g., '.card-item', 'li.card')"

  output_file:
    type: string
    required: false
    description: "Path to save extracted decklist (default: stdout)"

steps:
  - name: fetch_html
    skill: web/fetch-content
    args:
      url: "{{inputs.url}}"
      output: "/tmp/fetched_page.html"
    outputs:
      html_file: "/tmp/fetched_page.html"

  - name: extract_cards
    skill: data/extract-content-from-html
    args:
      content_file: "{{steps.fetch_html.outputs.html_file}}"
      extract_type: "list"
      selector: "{{inputs.selector}}"
      output: "{{inputs.output_file}}"
    outputs:
      decklist: "{{inputs.output_file}}"

outputs:
  decklist_file: "{{steps.extract_cards.outputs.decklist}}"
  card_count: "{{steps.extract_cards.result.count}}"
