name: "etl_pipeline"
description: "Complete ETL Pipeline - Extract → Transform → Load (workflow composition example)"
version: "1.0"

inputs:
  source_url:
    type: string
    required: true
    description: "Source URL to fetch data from"

  output_dir:
    type: string
    required: false
    description: "Output directory (default: /tmp/etl_output/)"

steps:
  # Step 1: Call etl_extract.yaml workflow (NOT a skill!)
  - name: extract
    workflow: workflows/etl_extract.yaml  # ← KEY: workflow: reference!
    args:
      url: "{{inputs.source_url}}"
      output_file: "/tmp/etl_extracted.html"
    outputs:
      extracted_file: "{{result.extracted_file}}"

  # Step 2: Call etl_transform.yaml workflow
  - name: transform
    workflow: workflows/etl_transform.yaml  # ← Another workflow reference!
    args:
      html_file: "{{steps.extract.outputs.extracted_file}}"  # ← Uses previous workflow's output!
      output_format: "markdown"
    outputs:
      transformed_file: "{{result.transformed_file}}"

outputs:
  final_output: "{{steps.transform.outputs.transformed_file}}"
  pipeline_status: "complete"
  stages_completed: ["extract", "transform"]
