# Template Registry: Card Size Standards
# Maps card types to PPTX templates with correct slot dimensions

card_sizes:
  # Standard trading card game sizes
  mtg:
    name: "Magic: The Gathering"
    width_inches: 2.5
    height_inches: 3.5
    width_mm: 63
    height_mm: 88
    aspect_ratio: 0.714  # width/height
    template: "template_2v6h_FIXED.pptx"
    aliases: ["magic", "pokemon", "standard_tcg"]
    notes: "Pokemon TCG uses same size as MTG"

  yugioh:
    name: "Yu-Gi-Oh!"
    width_inches: 2.31
    height_inches: 3.31
    width_mm: 59
    height_mm: 86
    aspect_ratio: 0.698
    template: "template_yugioh_2v6h.pptx"  # To be created
    aliases: ["ygo", "yugi"]
    notes: "Slightly smaller than MTG"

  mini:
    name: "Mini Cards"
    width_inches: 1.75
    height_inches: 2.5
    width_mm: 44
    height_mm: 63
    aspect_ratio: 0.700
    template: "template_mini_2v6h.pptx"  # To be created
    aliases: ["token", "small"]
    notes: "Used for tokens, small games"

  tarot:
    name: "Tarot Size"
    width_inches: 2.75
    height_inches: 4.75
    width_mm: 70
    height_mm: 120
    aspect_ratio: 0.579
    template: "template_tarot_2v6h.pptx"  # To be created
    aliases: ["large"]
    notes: "Larger format, common in some board games"

  business:
    name: "Business Card"
    width_inches: 3.5
    height_inches: 2.0
    width_mm: 89
    height_mm: 51
    aspect_ratio: 1.750  # Landscape by default
    template: "template_business_8h.pptx"  # To be created
    aliases: ["badge", "namecard"]
    notes: "Landscape orientation, 8 horizontal slots"

# Default fallback
default:
  card_size: "mtg"
  template: "template_2v6h_FIXED.pptx"
  reason: "MTG is most common trading card game format"

# Template naming convention
naming_convention:
  pattern: "template_{size}_{layout}.pptx"
  examples:
    - "template_mtg_2v6h.pptx = 2 vertical + 6 horizontal MTG slots"
    - "template_yugioh_2v6h.pptx = 2 vertical + 6 horizontal Yu-Gi-Oh slots"
    - "template_business_8h.pptx = 8 horizontal business card slots"

# Slot layout patterns
layouts:
  "2v6h":
    description: "2 vertical cards (left) + 6 horizontal cards (right)"
    slots: 8
    page_orientation: "landscape"
    page_size: "11x8.5 inches (US Letter landscape)"

  "8h":
    description: "8 horizontal cards in grid"
    slots: 8
    page_orientation: "landscape"
    page_size: "11x8.5 inches"

  "9grid":
    description: "9 cards in 3x3 grid"
    slots: 9
    page_orientation: "portrait"
    page_size: "8.5x11 inches (US Letter portrait)"

# How to create new templates
template_creation_guide:
  method: "Manual PPTX editing"
  steps:
    - "Open template_2v6h_FIXED.pptx in PowerPoint"
    - "Select all rectangle shapes (Ctrl+A)"
    - "Resize to target dimensions from card_sizes above"
    - "Maintain relative positions (scale proportionally)"
    - "Save as new template name from registry"

  automated_generation:
    status: "Not implemented (would add complexity)"
    rationale: "Templates are created once, minimal overhead"
    future: "Could add generate-template.py if >10 card sizes needed"
