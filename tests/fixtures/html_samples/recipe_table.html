<!DOCTYPE html>
<html>
<head><title>Recipe Ingredients</title></head>
<body>
<div class="recipe">
  <h2>Chocolate Cake</h2>
  <table class="ingredients">
    <thead>
      <tr>
        <th>Ingredient</th>
        <th>Amount</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Flour</td>
        <td>2 cups</td>
      </tr>
      <tr>
        <td>Sugar</td>
        <td>1.5 cups</td>
      </tr>
      <tr>
        <td>Cocoa powder</td>
        <td>3/4 cup</td>
      </tr>
      <tr>
        <td>Eggs</td>
        <td>3</td>
      </tr>
    </tbody>
  </table>
</div>
</body>
</html>
