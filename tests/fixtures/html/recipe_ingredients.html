<!DOCTYPE html>
<html>
<head>
    <title>Recipe - Chocolate Chip Cookies</title>
</head>
<body>
    <h1>Classic Chocolate Chip Cookies</h1>
    <div class="recipe-card">
        <h2>Ingredients</h2>
        <ul class="ingredient-list">
            <li class="ingredient">2 1/4 cups all-purpose flour</li>
            <li class="ingredient">1 tsp baking soda</li>
            <li class="ingredient">1 cup butter, softened</li>
            <li class="ingredient">3/4 cup granulated sugar</li>
            <li class="ingredient">2 cups chocolate chips</li>
        </ul>
    </div>
</body>
</html>
