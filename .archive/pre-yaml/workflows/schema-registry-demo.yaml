name: schema-registry-demo
description: |
  GraphQL-Inspired Schema Registry Demonstration

  This workflow showcases the protocol-first API abstraction layer with:
  - Schema registration (define once, reuse everywhere)
  - JSONPath-like field extraction
  - Multiple API support (Scryfall, PokeAPI, custom APIs)
  - Auto-discovery via probe skill

# === SCHEMA REGISTRY ===
# Register API response schemas here for reuse across workflows
api_schemas:
  # Scryfall Magic Card API
  scryfall:
    image_url: "image_uris.normal"
    image_url_multi: "card_faces[].image_uris.normal"  # For double-faced cards
    name_field: "name"
    min_image_size: 1000  # MTG card images are large (~200-500KB)

  # Pokemon API
  pokeapi:
    image_url: "sprites.front_default"
    image_url_fallback: "sprites.other.official-artwork.front_default"  # High-res fallback
    name_field: "name"
    min_image_size: 100  # Sprites are small (~500-2000 bytes)

  # Star Wars API (example - not tested)
  swapi:
    image_url: "image"  # Hypothetical field
    name_field: "name"
    min_image_size: 500

  # Generic image API template
  generic:
    image_url: "url"
    name_field: "title"
    min_image_size: 200

# === WORKFLOW STEPS ===
steps:
  # Step 1: Auto-discover schema for unknown API (optional)
  - name: probe-api-schema
    skill: data/probe-api-schema
    input:
      api_url: ${input.api_url}
      sample_id: ${input.sample_identifier}
    output_var: discovered_schema
    condition: ${input.auto_discover} == true

  # Step 2: Fetch resources using registered schema
  - name: fetch-with-schema
    skill: data/fetch-from-api
    input:
      decklist_path: ${input.decklist_path}
      api_url: ${input.api_url}
      schema_json: ${input.schema_name}  # References api_schemas above
      output_dir: ${input.output_dir|images}
    output_var: fetch_result

output:
  status: ${fetch_result.status}
  manifest: ${fetch_result.manifest_path}
  discovered_schema: ${discovered_schema.schema}

# === USAGE EXAMPLES ===
#
# Example 1: Fetch Pokemon sprites
#   python3 a2a_orchestrator/orchestrator.py workflows/schema-registry-demo.yaml \
#     decklist_path=pokemon.txt \
#     api_url="https://pokeapi.co/api/v2/pokemon/{identifier}" \
#     schema_name=pokeapi
#
# Example 2: Fetch MTG cards (default)
#   python3 a2a_orchestrator/orchestrator.py workflows/schema-registry-demo.yaml \
#     decklist_path=decklists/frog_tribal.txt \
#     api_url="https://api.scryfall.com/cards/named?fuzzy={identifier}" \
#     schema_name=scryfall
#
# Example 3: Auto-discover + fetch from unknown API
#   python3 a2a_orchestrator/orchestrator.py workflows/schema-registry-demo.yaml \
#     decklist_path=items.txt \
#     api_url="https://api.example.com/items/{identifier}" \
#     auto_discover=true \
#     sample_identifier="test-item"
#
# Example 4: Use probe skill standalone to discover schema
#   .claude/skills/data/probe-api-schema.py \
#     --api-url "https://pokeapi.co/api/v2/pokemon/{identifier}" \
#     --sample-id "charizard" \
#     --output pokemon_schema.json
