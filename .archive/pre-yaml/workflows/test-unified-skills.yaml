name: test-unified-skills
description: Test unified skill system via A2A orchestration

steps:
  - name: fetch-cards
    skill: data/fetch-from-api
    input:
      decklist_path: ${input.decklist_path}
      output_dir: /tmp/test-a2a-fetch
      manifest_path: /tmp/test-a2a-manifest.json
    output_var: fetch_result

output:
  status: ${fetch_result.status}
  manifest: ${fetch_result.manifest_path}
