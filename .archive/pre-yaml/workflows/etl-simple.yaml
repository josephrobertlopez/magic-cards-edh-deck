# Simple ETL Workflow Example
# Shows how data flows through skills: Extract → Transform → Load

name: simple-etl
description: Minimal ETL pipeline example

steps:
  # EXTRACT: Get raw data
  - skill: fetch-cards
    input:
      decklist: ${input.decklist_path}
    output_var: raw_data  # ← Outputs manifest JSON path

  # TRANSFORM: Process raw data into structured format
  - skill: generate-presentation
    input:
      manifest: ${raw_data}  # ← Uses output from Extract
      template: ${input.template_path}
      output_path: outputs/deck.pptx
    output_var: transformed_data  # ← Outputs PPTX path

  # LOAD: Write to final destination
  - skill: convert-to-pdf
    input:
      source: ${transformed_data}  # ← Uses output from Transform
    output_var: final_output  # ← Outputs PDF path

# The orchestrator executes this as:
#   manifest = fetch_cards(decklist)
#   pptx = generate_presentation(manifest, template)
#   pdf = convert_to_pdf(pptx)
#   return pdf
