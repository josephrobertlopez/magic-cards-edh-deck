name: test-invalid-skill
description: Test workflow with invalid skill reference for validation testing

steps:
  - name: fetch-cards
    skill: data/fetch-from-api
    input:
      decklist_path: ${input.decklist_path}
    output_var: manifest_path

  - name: invalid-step
    skill: data/fetch-cards  # INVALID: This skill doesn't exist (should be data/fetch-from-api)
    input:
      list_file: ${input.decklist_path}
    output_var: fetch_result

output:
  message: "Workflow should fail before reaching this point"
