[pytest]
# Pytest configuration for magic-cards-edh-deck

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    e2e: marks tests as end-to-end tests
    network: marks tests requiring network access
    unit: Unit tests for isolated components
    performance: Performance and timing tests (SC-001, SC-007)
    us1: User Story 1 - Simple workflow execution
    us2: User Story 2 - Variable chaining
    us2b: User Story 2b - Workflow composition
    us3: User Story 3 - Domain-agnostic validation

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --durations=10

# Coverage options (used when running with --cov)
# Example: pytest --cov=magic_cards --cov=a2a_orchestrator --cov-report=html

# Asyncio configuration
asyncio_mode = auto

# Timeout for slow tests (prevents hanging)
timeout = 300

# Ignore patterns
norecursedirs = .git .venv venv env __pycache__ .pytest_cache htmlcov archive outputs
